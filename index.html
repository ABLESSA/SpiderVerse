<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Finger Magic Lite is a browser camera comic-effect playground powered by MediaPipe hand landmarks."
    />
    <title>Finger Magic Lite</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <div class="topbar">
        <div>
          <p class="eyebrow">Finger Magic Lite</p>
          <h1>Comic zones between your fingers</h1>
        </div>
        <p id="status" class="status" role="status">Loading hand tracker...</p>
      </div>

      <section class="stage" id="stage" aria-label="Live finger magic camera">
        <video id="camera" playsinline muted></video>
        <canvas id="output"></canvas>
        <canvas id="debug-canvas" aria-hidden="true"></canvas>
        <div class="stage-badge" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </section>

      <div class="controls" aria-label="Region effect controls">
        <div class="effect-pickers" id="effect-pickers"></div>
        <label class="debug-toggle">
          <input id="debug-toggle" type="checkbox" />
          <span>Debug</span>
        </label>
      </div>
    </main>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
